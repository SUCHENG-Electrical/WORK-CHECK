<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作單紀錄與統計 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-600 p-2 rounded-lg font-bold text-xl shadow">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">工作單紀錄與統計系統</h1>
                    <p class="text-xs text-indigo-200">Work Order & Maintenance Tracker</p>
                </div>
            </div>
            <nav class="flex space-x-2 bg-indigo-700 p-1 rounded-xl shadow-inner">
                <button onclick="switchTab('create')" id="nav-create" class="px-4 py-2 rounded-lg text-sm font-medium transition bg-white text-indigo-600 shadow">
                    <i class="fa-solid fa-plus-circle mr-1"></i> 新增工作單
                </button>
                <button onclick="switchTab('records')" id="nav-records" class="px-4 py-2 rounded-lg text-sm font-medium transition text-white hover:bg-indigo-600">
                    <i class="fa-solid fa-list-check mr-1"></i> 紀錄與列表
                </button>
                <button onclick="switchTab('stats')" id="nav-stats" class="px-4 py-2 rounded-lg text-sm font-medium transition text-white hover:bg-indigo-600">
                    <i class="fa-solid fa-chart-pie mr-1"></i> 數據統計
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 mt-6">

        <!-- TAB 1: 新增工作單 -->
        <section id="tab-create" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-file-pen text-indigo-600"></i> 建立新工作單
                    </h2>
                    <span id="display-order-no" class="bg-indigo-50 text-indigo-700 font-mono font-bold px-3 py-1.5 rounded-lg border border-indigo-200 text-sm">
                        單號載入中...
                    </span>
                </div>

                <form id="work-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    <!-- 基本資料 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- 地址區域 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">區域選擇</label>
                            <select id="addr-region" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">請選擇區域...</option>
                                <option value="SIMPANG RENGGAM">SIMPANG RENGGAM</option>
                                <option value="RENGGAM">RENGGAM</option>
                                <option value="Kluang">Kluang</option>
                                <option value="Ayer Hitam">Ayer Hitam</option>
                                <option value="KULAI">KULAI</option>
                                <option value="LAYANG">LAYANG</option>
                                <option value="MACHAP">MACHAP</option>
                                <option value="BENUT">BENUT</option>
                                <option value="POTIAN">POTIAN</option>
                                <option value="新山">新山</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <!-- 詳細地址 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">詳細地址內容</label>
                            <input type="text" id="addr-detail" placeholder="請輸入詳細地址..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <!-- 對方電話 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">對方電話</label>
                            <input type="tel" id="cust-phone" placeholder="例如: 012-3456789" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <!-- 對方名稱 -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">對方名稱</label>
                            <input type="text" id="cust-name" placeholder="客戶姓名 / 公司名稱" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- 工作內容項目區塊 -->
                    <div class="pt-4 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base">工作內容與項目清單</h3>
                                <p class="text-xs text-slate-500">同一張單可加入多個不同類別與細項</p>
                            </div>
                            <button type="button" onclick="addItemRow()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold px-4 py-2 rounded-xl text-sm transition flex items-center gap-1.5 border border-indigo-200">
                                <i class="fa-solid fa-plus"></i> 新增工作項目
                            </button>
                        </div>

                        <!-- 項目動態載入容器 -->
                        <div id="items-container" class="space-y-3">
                            <!-- 項目列會透過 JS 動態生成 -->
                        </div>
                    </div>

                    <!-- 備註與提交 -->
                    <div class="pt-4 border-t border-slate-100 grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">備註說明</label>
                            <textarea id="order-remark" rows="2" placeholder="其他補充事項..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button type="button" onclick="resetForm()" class="px-5 py-2.5 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-100 font-medium text-sm transition">
                                清空重設
                            </button>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm shadow transition flex items-center gap-2">
                                <i class="fa-solid fa-save"></i> 儲存工作單
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- TAB 2: 紀錄與列表 -->
        <section id="tab-records" class="space-y-6 hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <!-- 搜尋與篩選列 -->
                <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
                    <div class="flex flex-wrap items-center gap-2">
                        <input type="text" id="search-keyword" placeholder="搜尋單號、地址、客戶..." oninput="renderRecordsList()" class="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none w-64">
                        <select id="filter-region" onchange="renderRecordsList()" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">全部區域</option>
                            <option value="SIMPANG RENGGAM">SIMPANG RENGGAM</option>
                            <option value="RENGGAM">RENGGAM</option>
                            <option value="Kluang">Kluang</option>
                            <option value="Ayer Hitam">Ayer Hitam</option>
                            <option value="KULAI">KULAI</option>
                            <option value="LAYANG">LAYANG</option>
                            <option value="MACHAP">MACHAP</option>
                            <option value="BENUT">BENUT</option>
                            <option value="POTIAN">POTIAN</option>
                            <option value="新山">新山</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="exportJSON()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 border border-slate-300">
                            <i class="fa-solid fa-download"></i> 匯出 JSON
                        </button>
                        <button onclick="clearAllData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 border border-rose-200">
                            <i class="fa-solid fa-trash-can"></i> 清除全部
                        </button>
                    </div>
                </div>

                <!-- 紀錄表格 -->
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                                <th class="p-3.5">工作單號</th>
                                <th class="p-3.5">日期時間</th>
                                <th class="p-3.5">區域 / 地址</th>
                                <th class="p-3.5">客戶名稱 / 電話</th>
                                <th class="p-3.5">工作內容摘要 (單項列表)</th>
                                <th class="p-3.5 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="records-table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                            <!-- 動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 3: 數據統計 -->
        <section id="tab-stats" class="space-y-6 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-semibold uppercase">總工作單數</p>
                        <h3 id="stat-total-orders" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-semibold uppercase">總工作項目數</p>
                        <h3 id="stat-total-items" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-semibold uppercase">熱門類別</p>
                        <h3 id="stat-top-category" class="text-lg font-bold text-slate-800 truncate max-w-[180px]">無</h3>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-800 text-base mb-4">各工作類別項目統計</h3>
                <div class="relative h-72">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- 詳細檢視 Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">工作單詳情</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            <div id="modal-content" class="space-y-4 text-sm">
                <!-- 動態載入單據詳情 -->
            </div>
            <div class="flex justify-end pt-3 border-t border-slate-100">
                <button onclick="closeModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">關閉</button>
            </div>
        </div>
    </div>

        // 資料持久化 Key
        const STORAGE_KEY = "work_records_db_v2";
        let workRecords = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let myChart = null;

        // 初始化
        window.onload = function() {
            generateOrderNo();
            addItemRow(); // 預設加入一行項目
            renderRecordsList();
            updateStats();
        };

        // Tab 切換
        function switchTab(tabId) {
            document.getElementById('tab-create').classList.add('hidden');
            document.getElementById('tab-records').classList.add('hidden');
            document.getElementById('tab-stats').classList.add('hidden');

            document.getElementById('nav-create').className = "px-4 py-2 rounded-lg text-sm font-medium transition text-white hover:bg-indigo-600";
            document.getElementById('nav-records').className = "px-4 py-2 rounded-lg text-sm font-medium transition text-white hover:bg-indigo-600";
            document.getElementById('nav-stats').className = "px-4 py-2 rounded-lg text-sm font-medium transition text-white hover:bg-indigo-600";

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "px-4 py-2 rounded-lg text-sm font-medium transition bg-white text-indigo-600 shadow";

            if(tabId === 'stats') {
                renderChart();
            }
        }

        // 自動生成工作單編號 WR0000 - WR9999
        function generateOrderNo() {
            let nextNum = 1;
            if (workRecords.length > 0) {
                // 找出最大的編號
                const nums = workRecords.map(r => {
                    const match = r.orderNo.match(/WR(\d{4})/);
                    return match ? parseInt(match[1], 10) : 0;
                });
                const maxNum = Math.max(...nums, 0);
                nextNum = maxNum + 1;
            }
            if (nextNum > 9999) nextNum = 0; // 超過循環
            const formattedNo = `WR${String(nextNum).padStart(4, '0')}`;
            document.getElementById('display-order-no').innerText = `工作單號: ${formattedNo}`;
            return formattedNo;
        }

        // 動態新增工作項目列
        function addItemRow() {
            const container = document.getElementById('items-container');
            const rowId = 'item-row-' + Date.now() + Math.random().toString(36).substr(2, 4);
            
            const div = document.createElement('div');
            div.className = "flex flex-col sm:flex-row gap-3 items-center bg-slate-50 border border-slate-200 p-3.5 rounded-xl";
            div.id = rowId;

            div.innerHTML = `
                <div class="w-full sm:w-1/4">
                    <select onchange="updateSubItems(this, '${rowId}')" class="category-select w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                        <option value="">選擇類別...</option>
                        <option value="水">水</option>
                        <option value="風扇">風扇</option>
                        <option value="電">電</option>
                        <option value="電動門">電動門</option>
                        <option value="保安及防盜">保安及防盜</option>
                        <option value="燈">燈</option>
                    </select>
                </div>
                <div class="w-full sm:w-2/5">
                    <select class="subitem-select w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                        <option value="">請先選擇類別</option>
                    </select>
                </div>
                <div class="w-full sm:w-1/6">
                    <select class="qty-select w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                        ${Array.from({length: 20}, (_, i) => `<option value="${i+1}" ${i===0?'selected':''}>數量: ${i+1}</option>`).join('')}
                    </select>
                </div>
                <div class="w-full sm:w-1/4 flex gap-2">
                    <input type="text" placeholder="備註/說明" class="item-note w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button type="button" onclick="removeRow('${rowId}')" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-lg text-sm transition"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        }

        function removeRow(rowId) {
            const container = document.getElementById('items-container');
            if (container.children.length <= 1) {
                alert("至少需要保留一個工作項目！");
                return;
            }
            document.getElementById(rowId).remove();
        }

        // 當類別改變時更新對應的細項下拉選單
        function updateSubItems(selectElem, rowId) {
            const category = selectElem.value;
            const row = document.getElementById(rowId);
            const subSelect = row.querySelector('.subitem-select');
            
            subSelect.innerHTML = '<option value="">請選擇細項...</option>';
            if (category && categoryOptions[category]) {
                categoryOptions[category].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    subSelect.appendChild(opt);
                });
            }
        }

        // 提交表單
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const orderNo = document.getElementById('display-order-no').innerText.replace("工作單號: ", "").trim();
            const region = document.getElementById('addr-region').value;
            const detailAddr = document.getElementById('addr-detail').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const name = document.getElementById('cust-name').value.trim();
            const remark = document.getElementById('order-remark').value.trim();

            // 收集所有項目
            const rows = document.querySelectorAll('#items-container > div');
            const items = [];
            
            for (let row of rows) {
                const cat = row.querySelector('.category-select').value;
                const sub = row.querySelector('.subitem-select').value;
                const qty = row.querySelector('.qty-select').value;
                const note = row.querySelector('.item-note').value.trim();

                if (!cat || !sub) {
                    alert("請完整選擇所有項目的類別與細項！");
                    return;
                }
                items.push({ category: cat, subItem: sub, quantity: parseInt(qty), note: note });
            }

            const newRecord = {
                id: 'REC_' + Date.now(),
                orderNo: orderNo,
                date: new Date().toLocaleString('zh-HK'),
                region: region,
                address: detailAddr ? `${region} - ${detailAddr}` : region,
                phone: phone || '未提供',
                name: name || '未具名',
                items: items,
                remark: remark
            };

            workRecords.unshift(newRecord);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(workRecords));

            alert(`工作單 ${orderNo} 儲存成功！`);
            resetForm();
            switchTab('records');
            renderRecordsList();
            updateStats();
        }

        // 重設表單
        function resetForm() {
            document.getElementById('work-form').reset();
            document.getElementById('items-container').innerHTML = '';
            generateOrderNo();
            addItemRow();
        }

        // 渲染紀錄列表
        function renderRecordsList() {
            const tbody = document.getElementById('records-table-body');
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const filterRegion = document.getElementById('filter-region').value;

            tbody.innerHTML = '';

            const filtered = workRecords.filter(r => {
                const matchKeyword = r.orderNo.toLowerCase().includes(keyword) || 
                                     r.address.toLowerCase().includes(keyword) || 
                                     r.name.toLowerCase().includes(keyword) || 
                                     r.phone.toLowerCase().includes(keyword);
                const matchRegion = filterRegion === "" || r.region === filterRegion;
                return matchKeyword && matchRegion;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">沒有找到相關工作紀錄</td></tr>`;
                return;
            }

            filtered.forEach(r => {
                // 單項列表模式呈現摘要
                let itemsSummary = r.items.map(i => `<span class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded-md mr-1 mb-1 font-medium">[${i.category}] ${i.subItem} × ${i.quantity}</span>`).join('');

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-3.5 font-mono font-bold text-indigo-600">${r.orderNo}</td>
                    <td class="p-3.5 text-xs text-slate-500">${r.date}</td>
                    <td class="p-3.5 font-medium">${r.address}</td>
                    <td class="p-3.5">${r.name}<br><span class="text-xs text-slate-400">${r.phone}</span></td>
                    <td class="p-3.5 max-w-xs">${itemsSummary}</td>
                    <td class="p-3.5 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="viewDetail('${r.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-lg text-xs transition" title="檢視詳情"><i class="fa-solid fa-eye"></i></button>
                            <button onclick="deleteRecord('${r.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-2 rounded-lg text-xs transition" title="刪除"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 檢視單張單詳情
        function viewDetail(id) {
            const r = workRecords.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modal-title').innerText = `工作單詳情：${r.orderNo}`;
            
            let itemsHtml = r.items.map((i, idx) => `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <span class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded font-bold">${i.category}</span>
                        <p class="font-medium text-slate-800 mt-1">${i.subItem}</p>
                        ${i.note ? `<p class="text-xs text-slate-500 mt-0.5">備註: ${i.note}</p>` : ''}
                    </div>
                    <div class="text-right font-bold text-indigo-600">
                        數量: ${i.quantity}
                    </div>
                </div>
            `).join('');

            document.getElementById('modal-content').innerHTML = `
                <div class="grid grid-cols-2 gap-3 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 text-xs">
                    <div><span class="text-slate-500">建檔時間：</span><span class="font-medium">${r.date}</span></div>
                    <div><span class="text-slate-500">工作區域：</span><span class="font-medium">${r.region}</span></div>
                    <div><span class="text-slate-500">客戶名稱：</span><span class="font-medium">${r.name}</span></div>
                    <div><span class="text-slate-500">客戶電話：</span><span class="font-medium">${r.phone}</span></div>
                </div>
                <div>
                    <span class="text-xs font-semibold text-slate-500 uppercase">完整地址</span>
                    <p class="font-medium text-slate-800">${r.address}</p>
                </div>
                <div>
                    <span class="text-xs font-semibold text-slate-500 uppercase mb-2 block">工作項目單項列表</span>
                    <div class="space-y-2">${itemsHtml}</div>
                </div>
                ${r.remark ? `<div><span class="text-xs font-semibold text-slate-500 uppercase">整體備註</span><p class="text-slate-700">${r.remark}</p></div>` : ''}
            `;

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        // 刪除單筆紀錄
        function deleteRecord(id) {
            if (confirm("確定要刪除這張工作單嗎？")) {
                workRecords = workRecords.filter(r => r.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(workRecords));
                renderRecordsList();
                updateStats();
            }
        }

        // 清除全部
        function clearAllData() {
            if (confirm("警告：這將會刪除所有的歷史工作紀錄，且無法復原！確定嗎？")) {
                workRecords = [];
                localStorage.removeItem(STORAGE_KEY);
                renderRecordsList();
                updateStats();
                generateOrderNo();
                alert("所有紀錄已清空。");
            }
        }

        // 匯出 JSON
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workRecords, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `work_records_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }

        // 更新統計數據與圖表
        function updateStats() {
            document.getElementById('stat-total-orders').innerText = workRecords.length;
            
            let totalItemsCount = 0;
            let catCounts = {};

            workRecords.forEach(r => {
                r.items.forEach(i => {
                    totalItemsCount += i.quantity;
                    catCounts[i.category] = (catCounts[i.category] || 0) + i.quantity;
                });
            });

            document.getElementById('stat-total-items').innerText = totalItemsCount;

            let topCat = "無";
            let maxCount = 0;
            for (let cat in catCounts) {
                if (catCounts[cat] > maxCount) {
                    maxCount = catCounts[cat];
                    topCat = `${cat} (${maxCount}項)`;
                }
            }
            document.getElementById('stat-top-category').innerText = topCat;
        }

        function renderChart() {
            let catCounts = { "水": 0, "風扇": 0, "電": 0, "電動門": 0, "保安及防盜": 0, "燈": 0 };

            workRecords.forEach(r => {
                r.items.forEach(i => {
                    if (catCounts[i.category] !== undefined) {
                        catCounts[i.category] += i.quantity;
                    } else {
                        catCounts[i.category] = i.quantity;
                    }
                });
            });

            const ctx = document.getElementById('categoryChart').getContext('2d');
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(catCounts),
                    datasets: [{
                        label: '工作項目統計數量',
                        data: Object.values(catCounts),
                        backgroundColor: [
                            'rgba(99, 102, 241, 0.8)',
                            'rgba(14, 165, 233, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(168, 85, 247, 0.8)'
                        ],
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } }
                    }
                }
            });
        }
    </script>
</body>
</html>
