<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作單紀錄與統計系統 (SheetDB 雲端同步版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-sky-100 text-sky-950 border-b border-sky-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-sky-600 text-white p-2 rounded-xl font-bold text-xl shadow-sm">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-sky-950">工作單紀錄與統計系統</h1>
                    <p class="text-xs text-sky-700">SheetDB 雲端即時同步版</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="sync-status" class="text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 font-medium">
                    <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 雲端已連線
                </span>
                <nav class="flex space-x-2 bg-sky-200/60 p-1 rounded-xl">
                    <button onclick="switchTab('create')" id="nav-create" class="px-4 py-2 rounded-lg text-sm font-medium transition bg-white text-sky-700 shadow-sm">
                        <i class="fa-solid fa-plus-circle mr-1"></i> 新增工作單
                    </button>
                    <button onclick="switchTab('records')" id="nav-records" class="px-4 py-2 rounded-lg text-sm font-medium transition text-sky-800 hover:bg-sky-200/80">
                        <i class="fa-solid fa-list-check mr-1"></i> 紀錄與列表
                    </button>
                    <button onclick="switchTab('stats')" id="nav-stats" class="px-4 py-2 rounded-lg text-sm font-medium transition text-sky-800 hover:bg-sky-200/80">
                        <i class="fa-solid fa-chart-pie mr-1"></i> 數據統計
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 mt-6">

        <!-- TAB 1: 新增 / 修改工作單 -->
        <section id="tab-create" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                    <h2 id="form-title" class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-file-pen text-sky-600"></i> 建立新工作單
                    </h2>
                    <span id="display-order-no" class="bg-sky-50 text-sky-700 font-mono font-bold px-3 py-1.5 rounded-lg border border-sky-200 text-sm">
                        單號載入中...
                    </span>
                </div>

                <form id="work-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    <input type="hidden" id="edit-record-id" value="">

                    <!-- 基本資料 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">區域選擇</label>
                            <select id="addr-region" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="">請選擇區域...</option>
                                <option value="SIMPANG RENGGAM">SIMPANG RENGGAM</option>
                                <option value="RENGGAM">RENGGAM</option>
                                <option value="Kluang">Kluang</option>
                                <option value="Ayer Hitam">Ayer Hitam</option>
                                <option value="KULAI">KULAI</option>
                                <option value="LAYANG">LAYANG</option>
                                <option value="MACHAP">MACHAP</option>
                                <option value="BENUT">BENUT</option>
                                <option value="POTIAN">POTIAN</option>
                                <option value="新山">新山</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">詳細地址內容</label>
                            <input type="text" id="addr-detail" placeholder="請輸入詳細地址..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">對方電話</label>
                            <input type="tel" id="cust-phone" placeholder="例如: 012-3456789" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">對方名稱</label>
                            <input type="text" id="cust-name" placeholder="客戶姓名 / 公司" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">負責人</label>
                            <select id="staff-tag" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="">請選擇負責人...</option>
                                <option value="祿">祿</option>
                                <option value="炎">炎</option>
                            </select>
                        </div>
                    </div>

                    <!-- 工作內容項目區塊 -->
                    <div class="pt-4 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base">工作內容與項目清單</h3>
                                <p class="text-xs text-slate-500">同一張單可加入多個不同類別與細項</p>
                            </div>
                            <button type="button" onclick="addItemRow()" class="bg-sky-50 text-sky-700 hover:bg-sky-100 font-semibold px-4 py-2 rounded-xl text-sm transition flex items-center gap-1.5 border border-sky-200">
                                <i class="fa-solid fa-plus"></i> 新增工作項目
                            </button>
                        </div>

                        <div id="items-container" class="space-y-3"></div>
                    </div>

                    <!-- 備註與提交 -->
                    <div class="pt-4 border-t border-slate-100 grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">備註說明</label>
                            <textarea id="order-remark" rows="2" placeholder="其他補充事項..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button type="button" onclick="resetForm()" class="px-5 py-2.5 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-100 font-medium text-sm transition">
                                清空重設
                            </button>
                            <button type="submit" id="submit-btn" class="bg-sky-600 hover:bg-sky-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm shadow transition flex items-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並同步至雲端
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- TAB 2: 紀錄與列表 -->
        <section id="tab-records" class="space-y-6 hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
                    <div class="flex flex-wrap items-center gap-2">
                        <input type="text" id="search-keyword" placeholder="搜尋單號、地址、客戶..." oninput="renderRecordsList()" class="bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none w-64">
                        <select id="filter-region" onchange="renderRecordsList()" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="">全部區域</option>
                            <option value="SIMPANG RENGGAM">SIMPANG RENGGAM</option>
                            <option value="RENGGAM">RENGGAM</option>
                            <option value="Kluang">Kluang</option>
                            <option value="Ayer Hitam">Ayer Hitam</option>
                            <option value="KULAI">KULAI</option>
                            <option value="LAYANG">LAYANG</option>
                            <option value="MACHAP">MACHAP</option>
                            <option value="BENUT">BENUT</option>
                            <option value="POTIAN">POTIAN</option>
                            <option value="新山">新山</option>
                            <option value="其他">其他</option>
                        </select>
                        <select id="filter-tag" onchange="renderRecordsList()" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="">全部負責人</option>
                            <option value="祿">祿</option>
                            <option value="炎">炎</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="fetchFromCloud()" class="bg-sky-50 hover:bg-sky-100 text-sky-700 px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 border border-sky-300 shadow-sm">
                            <i class="fa-solid fa-arrows-rotate"></i> 重新整理雲端
                        </button>
                        <button onclick="exportExcel()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 border border-emerald-300 shadow-sm">
                            <i class="fa-solid fa-file-excel"></i> 匯出 Excel
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                                <th class="p-3.5">單號 / 負責人</th>
                                <th class="p-3.5">日期時間</th>
                                <th class="p-3.5">區域 / 地址</th>
                                <th class="p-3.5">客戶名稱 / 電話</th>
                                <th class="p-3.5">工作內容摘要</th>
                                <th class="p-3.5 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="records-table-body" class="divide-y divide-slate-100 text-sm text-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 3: 數據統計 -->
        <section id="tab-stats" class="space-y-6 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-semibold uppercase">總工作單數</p>
                        <h3 id="stat-total-orders" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-semibold uppercase">總工作項目數</p>
                        <h3 id="stat-total-items" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 font-semibold uppercase">熱門類別</p>
                        <h3 id="stat-top-category" class="text-lg font-bold text-slate-800 truncate max-w-[180px]">無</h3>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-800 text-base mb-4">各工作類別項目統計</h3>
                <div class="relative h-72">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- 詳細檢視 Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">工作單詳情</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            <div id="modal-content" class="space-y-4 text-sm"></div>
            <div class="flex justify-end pt-3 border-t border-slate-100">
                <button onclick="closeModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 (SheetDB 整合版) -->
    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/ndl8frkw8izr9";

        const categoryOptions = {
            "水": [
                "水缸(Tank)", "水缸(Tank) - 水球", "水缸(Tank) - 拆", "水缸(Tank) - 清洗", "水缸(Tank) - 裝",
                "水管", "水管 - 水管", "止水閥", "水管 - 止水閥", "拆 - 水管 - 止水閥", "裝 - 水管",
                "拆 - 水管", "裝 - 水管", "維修 - 水管", "維修", "水管(軟管)", "水管漏水",
                "維修 - 水錶", "來水管", "拆 - 水錶", "來水管 - 裝", "水龍頭", "水龍頭 - 拆",
                "水龍頭 - 枱面", "水龍頭 - 裝", "水龍頭 - 維修", "水龍頭（戶外）", "水龍頭（戶外） - 拆",
                "水龍頭（戶外） - 維修", "水龍頭（戶外） - 裝", "來水水管", "浴室花灑",
                "浴室花灑 - 拆", "浴室花灑 - 裝", "浴室花灑 - 維修", "馬桶", "馬桶 - 拆",
                "馬桶 - 裝", "馬桶 - 維修", "馬桶水球 - 維修", "馬桶水箱", "馬桶水箱 - 拆",
                "馬桶水箱 - 裝", "馬桶水箱 - 維修", "廁所水箱", "廁所水箱 - 水球", "廁所水箱 - 拆",
                "廁所水箱 - 裝", "廁所水箱 - 維修", "廁所水龍頭", "廁所水龍頭 - 拆", "廁所水龍頭 - 裝",
                "廁所水龍頭 - 維修", "廁所洗手盆", "廁所洗手盆 - 拆", "廁所洗手盆 - 裝",
                "廁所洗手盆 - 維修", "廁所噴槍 Bidet Sprayer", "廁所噴槍 Bidet Sprayer - 拆",
                "廁所噴槍 Bidet Sprayer - 裝", "廚房洗碗盤", "廚房洗碗盤 - 拆", "廚房洗碗盤 - 裝",
                "廚房隔油池", "廚房隔油池 - 拆", "廚房隔油池 - 裝", "牆身水龍頭", "牆身水龍頭 - 拆", "牆身水龍頭 - 裝"
            ],
            "風扇": [
                "風扇 - 風扇", "風扇 - 裝", "風扇 - 拆", "風扇 - 加位", "天花風扇",
                "天花風扇 - 裝", "天花風扇 - 拆", "天花風扇 - 加位", "牆壁掛扇",
                "牆壁掛扇 - 裝", "牆壁掛扇 - 拆", "牆壁掛扇 - 加位", "抽氣扇",
                "抽氣扇 - 裝", "抽氣扇 - 拆", "抽氣扇 - 加位", "風扇 Midea 掛牆扇",
                "風扇 osaki 24” 掛牆扇", "風扇 Sand’s CSL 18’ 掛牆扇", "抽氣扇 Osaki 10”", "抽氣扇 Panasonic"
            ],
            "電": [
                "插座", "插座 13A", "插座（ 防水 ）", "插座 13A（ 防水 ）", "雙插座（ 防水 ）",
                "插座 20A", "插座供電位(POINT）", "插座開關", "戶外插座", "改插座", "拆插座", "裝插座",
                "微型斷路器 10A", "微型斷路器 20A", "電工 20A", "三相制", "電工 40A 4P",
                "總閘冷氣制", "電工 6A", "分開關", "三相隔離開關", "三相電錶", "電工曲尺掣",
                "拆曲尺掣", "裝曲尺掣", "單開單控開關 1G1W", "開關", "雙開單控開關 2G1W",
                "電箱", "拆電箱", "裝電箱", "維修電箱", "電箱 (19位）", "電箱 (39位）",
                "電線 16MM", "電線 6mm 4core", "電線拉線"
            ],
            "電動門": [
                "電動門", "電動門 - 裝", "電動門 - 拆", "電動門包電線", "電動門線"
            ],
            "保安及防盜": [
                "防盜 Blueguard link mobile", "防盜 UNV ip 2mp camera 4ch & 8mp camera 2tb hdd",
                "防盜 UNV XVR 16CH DVR", "CCTV - Alarm 揚聲器", "CCTV - Alarm 揚聲器 - 拆",
                "CCTV - Alarm 揚聲器 - 裝", "CCTV - Alarm 揚聲器 - 維修", "CCTV - Alarm Point",
                "門鈴", "門鈴 - 安裝"
            ],
            "燈": [
                "燈 10m LED Tape Light", "燈", "天花燈 L BOX light", "燈 - 安裝", "射燈 Downlight",
                "涼棚燈", "燈 - 電線", "燈 - 維修", "燈泡", "貓眼燈", "牆壁燈", "燈 down light",
                "燈 exit sign", "燈 JSE down light", "燈 JSE Led light", "燈 Jse Spotlight 50W",
                "燈 L box light", "燈 LED 10W", "燈 LED Light", "燈 Led t8", "燈 Led t8 60w",
                "燈 Led t8 60w set", "燈 Led t8 長燈 60w", "燈 LED T8 double 60W", "燈 LED T8 set",
                "燈 Magamen down light 15w", "燈 Mageman 30W LED Light", "燈位", "燈位 - 天花燈",
                "燈位 - 光管", "燈位 - 涼棚燈", "燈位 - 感應燈", "燈位 - 壁燈", "燈位 - 燈泡",
                "燈位 - 貓眼燈", "燈位 Down Light", "燈位 LED LIGHT", "燈位 Spot Light", "燈位 Track Light"
            ]
        };

        let workRecords = [];

        window.onload = function() {
            generateOrderNo();
            addItemRow();
            fetchFromCloud();
        };

        // 從 SheetDB 讀取資料
        function fetchFromCloud() {
            setSyncStatus("同步中...", "bg-amber-100 text-amber-800 border-amber-300");
            fetch(SHEETDB_URL)
                .then(res => res.json())
                .then(flatData => {
                    // 將 SheetDB 的平鋪列資料還原為結構化記錄
                    workRecords = parseFlatDataToRecords(flatData);
                    renderRecordsList();
                    updateStats();
                    generateOrderNo();
                    setSyncStatus("雲端已連線", "bg-emerald-100 text-emerald-800 border-emerald-300");
                })
                .catch(err => {
                    console.error(err);
                    setSyncStatus("連線失敗", "bg-rose-100 text-rose-800 border-rose-300");
                });
        }

        // 把試算表的平鋪列轉成前端的 records 格式
        function parseFlatDataToRecords(flatData) {
            if (!Array.isArray(flatData)) return [];
            let recordsMap = {};
            flatData.forEach(row => {
                let orderNo = row["工作單號"];
                if (!orderNo) return;

                if (!recordsMap[orderNo]) {
                    recordsMap[orderNo] = {
                        id: 'REC_' + orderNo,
                        orderNo: orderNo,
                        staffTag: row["負責人"] || '',
                        date: row["建檔日期"] || '',
                        region: row["區域"] || '',
                        address: row["詳細地址"] || '',
                        name: row["客戶名稱"] || '',
                        phone: row["客戶電話"] || '',
                        remark: row["整體備註"] || '',
                        items: []
                    };
                }

                if (row["工作類別"] && row["工作細項"]) {
                    recordsMap[orderNo].items.push({
                        category: row["工作類別"],
                        subItem: row["工作細項"],
                        quantity: Number(row["數量"]) || 1,
                        note: row["項目備註"] || ''
                    });
                }
            });

            let result = [];
            for (let key in recordsMap) {
                result.push(recordsMap[key]);
            }
            return result.sort((a, b) => b.orderNo.localeCompare(a.orderNo));
        }

        // 儲存或更新至 SheetDB
        function syncRecordToCloud(record, isEdit = false) {
            setSyncStatus("同步至雲端中...", "bg-amber-100 text-amber-800 border-amber-300");

            // 將單筆記錄展開成多列（對應 SheetDB 結構）
            let rowsToSave = [];
            (record.items || []).forEach(item => {
                rowsToSave.push({
                    "工作單號": record.orderNo,
                    "負責人": record.staffTag || "",
                    "建檔日期": record.date,
                    "區域": record.region,
                    "詳細地址": record.address,
                    "客戶名稱": record.name,
                    "客戶電話": record.phone,
                    "工作類別": item.category,
                    "工作細項": item.subItem,
                    "數量": item.quantity,
                    "項目備註": item.note || "",
                    "整體備註": record.remark || ""
                });
            });

            const executeSave = () => {
                fetch(`${SHEETDB_URL}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(rowsToSave)
                })
                .then(res => res.json())
                .then(res => {
                    setSyncStatus("雲端已連線", "bg-emerald-100 text-emerald-800 border-emerald-300");
                    fetchFromCloud(); // 重新整理
                })
                .catch(err => {
                    console.error(err);
                    setSyncStatus("雲端同步失敗", "bg-rose-100 text-rose-800 border-rose-300");
                });
            };

            if (isEdit) {
                // 如果是編輯，先刪除雲端舊的該單號資料，再寫入新資料
                fetch(`${SHEETDB_URL}/工作單號/${record.orderNo}`, {
                    method: "DELETE"
                }).then(() => {
                    executeSave();
                }).catch(() => {
                    executeSave();
                });
            } else {
                executeSave();
            }
        }

        function generateOrderNo() {
            const editId = document.getElementById('edit-record-id').value;
            if (editId) return;

            let nextNum = 1;
            if (workRecords.length > 0) {
                const nums = workRecords.map(r => {
                    const match = r.orderNo ? r.orderNo.match(/WR(\d{4})/) : null;
                    return match ? parseInt(match[1], 10) : 0;
                });
                const maxNum = Math.max(...nums, 0);
                nextNum = maxNum + 1;
            }
            if (nextNum > 9999) nextNum = 0;
            const formattedNo = `WR${String(nextNum).padStart(4, '0')}`; document.getElementById('display-order-no').innerText = `工作單號: ${formattedNo}`;
            return formattedNo;
        }
